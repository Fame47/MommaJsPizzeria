<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,height=device-height,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Jody's Pizza - Pizza Loop v20 Clock & Daily Goals</title>
<style>
  :root{--gold:#f2c45c;--red:#8d241b;--ink:#120d09;--green:#63e58a}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050403;color:#fff;font-family:Arial,Helvetica,sans-serif;overscroll-behavior:none}
  body{position:fixed;inset:0;display:grid;place-items:center;touch-action:none}
  #game{position:absolute;left:50%;top:50%;width:1920px;height:1080px;background:#000;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none;transform-origin:center center;will-change:transform}
  .layer{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none}
  .hidden{display:none!important}

  #background{z-index:0}
  #customerLeft,#customer,#customerRight,#orderBubbleLeftPizza,#orderLeftPizza,#orderBubbleLeftDrink,#orderLeftDrink,#orderBubbleMiddlePizza,#orderMiddlePizza,#orderBubbleMiddleDrink,#orderMiddleDrink,#orderBubbleRightPizza,#orderRightPizza,#orderBubbleRightDrink,#orderRightDrink{z-index:8}
  #walkinsTab,#moneyTab{z-index:15}
  #counterFront{z-index:12}

  #pepperoniPanEmpty{z-index:18}
  #doughCounter,#crust,#spoon,#sauced,#cheeseCounter,#cheeseLayer,#sausageFull,#sausageHalf,#pepperoniCut,#rawPizza,#ovenOpen,#pizzaOvenOpen,#pizzaOvenClosed,#bottomOvenOpen,#bottomPizzaOvenOpen,#bottomPizzaOvenClosed,#finished,#burnt,#openBox,#closedBox{z-index:20}
  #openBox{z-index:22}
  #finished{z-index:24}

  #customer,#customerRight,#customerLeft{transform:translateX(38%);opacity:0;transition:transform .75s ease,opacity .3s ease}
  #customer.in,#customerRight.in,#customerLeft.in{transform:translateX(0);opacity:1}
  #customer.out,#customerRight.out,#customerLeft.out{transform:translateX(42%);opacity:0}
  #orderBubbleLeftPizza,#orderLeftPizza{transform:translateX(-300px)}
  #cupLeftEmpty,#cupLeftFull,#cupRightEmpty,#cupRightFull{z-index:21}
  #cupLeftFull.drink-ready,#cupRightFull.drink-ready{filter:drop-shadow(0 0 10px #91eaff) drop-shadow(0 0 18px #35a9ff);animation:drinkPulse .65s ease-in-out infinite alternate}
  #cupLeftFull.drink-selected,#cupRightFull.drink-selected{filter:drop-shadow(0 0 15px #fff5a0) drop-shadow(0 0 28px #ffbf21) brightness(1.28);animation:drinkSelectPulse .45s ease-in-out infinite alternate}
  @keyframes drinkSelectPulse{from{transform:scale(.98)}to{transform:scale(1.025)}}
  @keyframes drinkPulse{from{filter:drop-shadow(0 0 5px #91eaff)}to{filter:drop-shadow(0 0 18px #35a9ff) brightness(1.18)}}
  #closedBox.delivering{animation:boxToCustomer 1.15s ease-in forwards}
  #stockSlot1,#stockSlot2,#stockSlot3,#stockSlot4{z-index:28;pointer-events:none}
  #stockSlot1.selected,#stockSlot2.selected,#stockSlot3.selected,#stockSlot4.selected{filter:drop-shadow(0 0 10px #ffe26a) drop-shadow(0 0 18px #ffb300);animation:stockPulse .8s ease-in-out infinite alternate}
  .oven-burnt{filter:drop-shadow(0 0 8px #ff5a36) drop-shadow(0 0 18px #ff1e00) brightness(1.22);animation:burntPulse .62s ease-in-out infinite alternate}
  @keyframes burntPulse{from{filter:drop-shadow(0 0 6px #ff7b49) drop-shadow(0 0 12px #c81900) brightness(1.08)}to{filter:drop-shadow(0 0 13px #ffbc66) drop-shadow(0 0 28px #ff2300) brightness(1.34)}}
  .trash-label{position:absolute;z-index:62;display:grid;place-items:center;border-radius:8px;background:rgba(82,8,4,.92);border:2px solid #ff7b4a;color:#fff3d7;font-weight:1000;font-size:24px;letter-spacing:.08em;text-shadow:0 2px 3px #000;pointer-events:none;box-shadow:0 0 14px #ff2600cc;animation:trashPulse .62s ease-in-out infinite alternate}
  @keyframes trashPulse{from{transform:scale(.96)}to{transform:scale(1.04)}}
  @keyframes stockPulse{from{filter:drop-shadow(0 0 7px #ffe26a)}to{filter:drop-shadow(0 0 18px #ffb300)}}
  #pepperoniPanEmpty.needsRestock{animation:panGlow .8s ease-in-out infinite alternate;filter:drop-shadow(0 0 8px #ffe26a)}
  @keyframes panGlow{from{filter:drop-shadow(0 0 5px #ffe26a)}to{filter:drop-shadow(0 0 20px #ff9d00) brightness(1.18)}}
  #stockTooltip{position:absolute;z-index:70;display:none;min-width:92px;padding:7px 10px;border-radius:7px;background:rgba(18,13,9,.94);border:1px solid #d0a058;color:#ffe29a;font-weight:900;font-size:16px;text-align:center;text-transform:uppercase;pointer-events:none;transform:translate(-50%,-115%);box-shadow:0 4px 14px #000b}

  #hud,#message{display:none}
  .panel{background:rgba(16,11,8,.9);border:1px solid #825d37;border-radius:10px;padding:.55rem .8rem;box-shadow:0 6px 18px #0009;font-weight:800;letter-spacing:.02em}
  #timer{display:none}

  #circleTimer,#ovenCircleTimer,#bottomOvenCircleTimer,#darkDrinkCircleTimer,#lightDrinkCircleTimer{position:absolute;z-index:58;width:clamp(34px,3.2vw,58px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#f2c45c 0deg,#2a1a11 0deg);box-shadow:0 0 0 4px rgba(10,7,5,.8),0 5px 18px #000c;pointer-events:none;transform:translate(-50%,-50%)}
  #circleTimer::before,#ovenCircleTimer::before,#bottomOvenCircleTimer::before,#darkDrinkCircleTimer::before,#lightDrinkCircleTimer::before{content:'';position:absolute;inset:6px;border-radius:50%;background:rgba(18,13,9,.94);border:2px solid #8c643c}
  #circleTimerText,#ovenCircleTimerText,#bottomOvenCircleTimerText,#darkDrinkCircleTimerText,#lightDrinkCircleTimerText{position:relative;z-index:1;color:#ffe079;font-weight:900;font-size:clamp(8px,.7vw,13px);text-align:center;line-height:1.02;text-shadow:0 2px 3px #000}

  .hotspot{position:absolute;z-index:50;border:0;background:transparent;box-shadow:none;cursor:pointer;padding:0;touch-action:manipulation}
  .hotspot:after{display:none}

  #spoon.saucing{animation:spoonCircle .75s linear infinite;transform-origin:61% 55%}
  #doughCounter.rolling{animation:doughRoll .55s ease-in-out infinite alternate}
  #cheeseCounter.shaking{animation:cheeseShake .42s ease-in-out infinite}
  #finished.toBox{animation:pizzaToBox .9s ease-out forwards}

  @keyframes spoonCircle{0%{transform:translate(0,0) rotate(0deg)}25%{transform:translate(8px,-5px) rotate(5deg)}50%{transform:translate(0,-10px) rotate(0deg)}75%{transform:translate(-8px,-5px) rotate(-5deg)}100%{transform:translate(0,0) rotate(0deg)}}
  @keyframes doughRoll{0%{transform:translateY(-8px) scaleY(0.98)}100%{transform:translateY(8px) scaleY(1.02)}}
  @keyframes cheeseShake{0%{transform:translate(-4px,-3px) rotate(-2deg)}25%{transform:translate(4px,-1px) rotate(1deg)}50%{transform:translate(-2px,3px) rotate(0deg)}75%{transform:translate(3px,1px) rotate(2deg)}100%{transform:translate(-3px,-2px) rotate(-1deg)}}
  @keyframes pizzaToBox{0%{transform:translateY(-24%) scale(.86);opacity:.35}70%{transform:translateY(-5%) scale(.96);opacity:1}100%{transform:translateY(0) scale(1);opacity:1}}
  @keyframes boxToCustomer{0%{transform:translate(0,0) scale(1);opacity:1}70%{transform:translate(-17%,-12%) scale(.82);opacity:1}100%{transform:translate(-19%,-14%) scale(.72);opacity:0}}

  #walkinsText{position:absolute;z-index:45;left:6.15%;top:13.2%;width:11.75%;height:18.85%;display:grid;grid-template-rows:repeat(3,1fr);text-align:left;color:#5a2a18;font-weight:900;line-height:1.05;pointer-events:none;text-shadow:0 1px #f2d7ad}
  .walkin-row{min-height:0;display:grid;grid-template-columns:18px minmax(0,1fr) 38px;align-items:center;column-gap:3px;border-bottom:2px solid rgba(95,45,24,.55);padding:2px 2px 2px 0}
  .walkin-row:last-child{border-bottom:0}
  .walkin-lane{font-size:clamp(9px,.68vw,13px);align-self:start;padding-top:3px;text-align:center}
  .walkin-order{font-size:clamp(7px,.52vw,10px);line-height:1.18;white-space:normal}
  .walkin-order-line{display:block}
  .walkin-timer{font-size:clamp(9px,.7vw,14px);color:#8d241b;text-align:right;align-self:center}
  #pepperoniPanLabel{position:absolute;z-index:46;left:20.8%;top:61.2%;width:8.8%;text-align:center;color:#f0c86c;font-weight:900;font-size:clamp(8px,.6vw,11px);letter-spacing:.04em;text-shadow:0 2px 3px #000;pointer-events:none}
  #moneyCollectText{position:absolute;z-index:45;left:79.35%;top:7.8%;width:8.6%;text-align:center;color:#7dff9c;font-weight:900;font-size:clamp(13px,1.15vw,23px);text-shadow:0 2px 4px #000;pointer-events:none}
  #flash{position:absolute;z-index:90;left:50%;top:18%;transform:translateX(-50%);opacity:0;background:#11100eea;border:1px solid #45bd6d;border-radius:10px;padding:.6rem 1rem;color:#75ff9c;font-weight:900;transition:.25s;pointer-events:none}
  #flash.show{opacity:1;top:20%}
  #reset{position:absolute;right:1.4%;top:1.4%;bottom:auto;z-index:80;min-width:96px;min-height:52px;border:1px solid #775332;border-radius:10px;background:#1a120d;color:#ead8b8;padding:.6rem .9rem;font-weight:800;font-size:20px;cursor:pointer;touch-action:manipulation}


  /* v19 phone orders + delivery map */
  #phoneOrderTab{z-index:14}
  #phoneRingLayer{z-index:34;pointer-events:none;transform-origin:21.2% 38.2%}
  #phoneRingLayer.ringing{animation:phoneShake .18s ease-in-out infinite alternate;filter:drop-shadow(0 0 9px #ffdb62) drop-shadow(0 0 18px #ff552b)}
  @keyframes phoneShake{from{transform:rotate(-1.4deg) translateX(-2px)}to{transform:rotate(1.4deg) translateX(2px)}}
  #phoneHotspot{z-index:56}

  #phoneOrdersPanel{position:absolute;z-index:46;left:6.45%;top:81.65%;width:37.15%;height:11.7%;display:grid;grid-template-rows:repeat(4,1fr);gap:0;color:#3eeaff;font-weight:1000;letter-spacing:.02em;text-shadow:0 2px 3px #000;pointer-events:auto}
  .phone-order-row{display:grid;grid-template-columns:41% 32% 27%;align-items:center;min-height:0;padding:0 8px;border:0;border-bottom:1px solid rgba(142,93,46,.38);background:transparent;color:#42edff;text-align:left;font:inherit;cursor:pointer;touch-action:manipulation}
  .phone-order-row:last-child{border-bottom:0}
  .phone-order-row.selected{background:linear-gradient(90deg,rgba(255,186,51,.22),rgba(255,186,51,.04));box-shadow:inset 4px 0 #ffc247}
  .phone-order-row.delivering{color:#ffe06a}
  .phone-order-row.late{color:#ff6a55}
  .phone-order-type,.phone-order-address{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .phone-order-time{font-size:18px;text-align:center;font-variant-numeric:tabular-nums}
  .phone-order-empty{grid-column:1/-1;color:#8a765d;font-size:14px;letter-spacing:.08em;text-align:left;padding-left:16px;align-self:center}
  #openMapButton{position:absolute;z-index:53;left:45.25%;top:80.1%;width:11.7%;height:13.5%;border:0;border-radius:8px;background:transparent;box-shadow:none;color:transparent;font-size:0;cursor:pointer;touch-action:manipulation}
  #openMapButton small{display:none}
  #openMapButton:hover{box-shadow:0 0 0 3px rgba(255,222,74,.35),0 0 20px rgba(255,184,22,.45)}
  #openMapButton:active{transform:scale(.985)}

  /* stronger walk-in typography and timer placement */
  #walkinsText{left:6.0%;top:13.0%;width:12.05%;height:19.25%;font-weight:1000;text-shadow:0 1px #f6ddb5,0 0 1px #5d2615}
  .walkin-row{grid-template-columns:30px minmax(0,1fr) 52px;column-gap:4px;padding:3px 4px 3px 0}
  .walkin-lane{font-size:20px!important;font-weight:1000;line-height:1;color:#6e170f;text-shadow:0 1px #efd4a5}
  .walkin-order{font-size:12px!important;font-weight:1000;line-height:1.12;color:#30150e}
  .walkin-timer{font-size:17px!important;font-weight:1000;text-align:center;padding-right:5px;color:#7c170f;font-variant-numeric:tabular-nums}

  #mapOverlay{position:absolute;inset:0;z-index:200;background:rgba(0,0,0,.97);overflow:hidden;pointer-events:auto}
  #deliveryMap,#mapHouseAHighlight,#mapHouseBHighlight,#mapHouseCHighlight,#mapOfficeHighlight,#mapApartmentsHighlight,#mapCarSprite,#mapBikeSprite{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none}
  #deliveryMap{z-index:201}
  .map-highlight{z-index:204;filter:drop-shadow(0 0 12px #fff45b) drop-shadow(0 0 26px #ffaf19);animation:mapGlow .55s ease-in-out infinite alternate}
  @keyframes mapGlow{from{filter:drop-shadow(0 0 7px #fff45b)}to{filter:drop-shadow(0 0 20px #ffaf19) brightness(1.16)}}
  #mapCarSprite,#mapBikeSprite{z-index:207;transition:filter .15s}
  #mapCarSprite.selected,#mapBikeSprite.selected{filter:drop-shadow(0 0 12px #fff76a) drop-shadow(0 0 24px #fc0) brightness(1.18)}
  #mapHazards{position:absolute;inset:0;z-index:206;pointer-events:none}
  .hazard-marker{position:absolute;width:58px;height:57px;object-fit:contain;filter:drop-shadow(0 2px 5px #000) drop-shadow(0 0 7px #ff9f2f);animation:hazardPop .3s ease-out}
  @keyframes hazardPop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
  .map-click{position:absolute;z-index:220;border:0;background:transparent;cursor:pointer;touch-action:manipulation}
  .map-click.debug{background:rgba(255,255,0,.2);border:2px solid yellow}
  .map-eta{position:absolute;z-index:214;min-width:105px;transform:translateX(-50%);padding:3px 7px;border-radius:7px;background:rgba(8,7,4,.9);border:1px solid #d5a348;color:#f9ed52;font-size:16px;font-weight:1000;text-align:center;text-shadow:0 2px 3px #000;pointer-events:none}
  #mapEtaHouseA{left:29.2%;top:29.1%} #mapEtaOffice{left:50.5%;top:27.9%} #mapEtaApartments{left:69.4%;top:28.0%} #mapEtaHouseC{left:29.2%;top:55.2%} #mapEtaHouseB{left:69.4%;top:55.0%}
  #mapOrderSummary{position:absolute;z-index:215;left:38%;top:5.2%;width:42%;padding:8px 12px;border-radius:9px;background:rgba(14,10,7,.86);border:1px solid #9d6d37;color:#f8dca1;font-size:19px;font-weight:1000;text-align:center;text-shadow:0 2px 4px #000;pointer-events:none}
  #mapRouteStatus{position:absolute;z-index:215;left:18.5%;top:65.1%;width:34%;min-height:72px;padding:8px 12px;border-radius:9px;background:rgba(14,10,7,.88);border:1px solid #9d6d37;color:#69ecff;font-size:16px;font-weight:900;line-height:1.25;text-align:left;text-shadow:0 2px 4px #000;pointer-events:none}
  #mapHazardCount{display:none!important}

  /* v20: clean thumbnail button, shop clock, closed sign, and daily goals */
  #clockBase{z-index:5}
  #clockHourHand,#clockMinuteHand{z-index:6;transform-origin:65.94% 13.15%;will-change:transform}
  #closedSign{z-index:18}
  #dailyGoals{position:absolute;z-index:47;left:71.7%;top:80.4%;width:21.5%;height:13.2%;padding:8px 14px;color:#f5dca4;text-shadow:0 2px 3px #000;pointer-events:none}
  #dailyGoalsTitle{font-size:18px;font-weight:1000;letter-spacing:.08em;color:#ffcf55;margin-bottom:5px}
  .daily-goal-row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;min-height:28px;font-size:15px;font-weight:900;border-bottom:1px solid rgba(157,106,55,.28)}
  .daily-goal-row:last-child{border-bottom:0}
  .daily-goal-count{color:#66edff;font-size:17px;font-variant-numeric:tabular-nums}
  .daily-goal-row.complete .daily-goal-label,.daily-goal-row.complete .daily-goal-count{color:#78ff99}
  #shopPhase{display:none}

</style>
</head>
<body>
<div id="game">
  <img id="background" class="layer" src="assets/main_background(1).png" alt="Jody's Pizza interior">
  <img id="counterFront" class="layer" src="assets/counter_front.png" alt="Pizza counter">
  <img id="walkinsTab" class="layer" src="assets/walkins_tab.png" alt="Walk-ins order tab">
  <img id="moneyTab" class="layer" src="assets/money_collect_tab.png" alt="Money collection tab">
  <div id="walkinsText" class="hidden">
    <div id="walkinLeft" class="walkin-row hidden"><div class="walkin-lane">L</div><div id="walkinsOrderLeft" class="walkin-order"></div><div id="walkinsTimerLeft" class="walkin-timer"></div></div>
    <div id="walkinMiddle" class="walkin-row hidden"><div class="walkin-lane">M</div><div id="walkinsOrder" class="walkin-order"></div><div id="walkinsTimer" class="walkin-timer"></div></div>
    <div id="walkinRight" class="walkin-row hidden"><div class="walkin-lane">R</div><div id="walkinsOrderRight" class="walkin-order"></div><div id="walkinsTimerRight" class="walkin-timer"></div></div>
  </div>
  <div id="moneyCollectText">$0.00</div>

  <img id="clockBase" class="layer" src="assets/clock_base.png" alt="Shop clock">
  <img id="clockHourHand" class="layer" src="assets/small_clock_hand.png" alt="Hour hand">
  <img id="clockMinuteHand" class="layer" src="assets/big_clock_hand.png" alt="Minute hand">
  <img id="closedSign" class="layer" src="assets/closed_sign.png" alt="Shop closed">
  <div id="shopPhase">PREP TIME</div>

  <img id="phoneOrderTab" class="layer" src="assets/phone_order_tab.png" alt="Phone orders tab">
  <div id="phoneOrdersPanel"></div>
  <button id="openMapButton" type="button" aria-label="Open delivery map"><small id="mapButtonStatus">NO PHONE ORDERS</small></button>
  <div id="dailyGoals">
    <div id="dailyGoalsTitle">DAILY GOALS</div>
    <div id="goalPizzasRow" class="daily-goal-row"><span class="daily-goal-label">MAKE 20 PIZZAS</span><span id="goalPizzas" class="daily-goal-count">00/20</span></div>
    <div id="goalDrinksRow" class="daily-goal-row"><span class="daily-goal-label">MAKE 10 DRINKS</span><span id="goalDrinks" class="daily-goal-count">00/10</span></div>
    <div id="goalDeliveriesRow" class="daily-goal-row"><span class="daily-goal-label">DO 15 DELIVERIES</span><span id="goalDeliveries" class="daily-goal-count">00/15</span></div>
  </div>
  <img id="phoneRingLayer" class="layer hidden" src="assets/phone_ring.png" alt="Phone ringing">
  <button id="phoneHotspot" class="hotspot" aria-label="Answer phone"></button>

  <img id="customerLeft" class="layer" src="assets/customer_vin_left.png" alt="Left customer">
  <img id="orderBubbleLeftPizza" class="layer hidden" src="assets/order_bubble_middle_queue.png" alt="Left pizza order bubble">
  <img id="orderLeftPizza" class="layer hidden" src="assets/order_cheese_middle_queue.png" alt="Left pizza order">
  <img id="orderBubbleLeftDrink" class="layer hidden" src="assets/order_bubble_left_drink_queue.png" alt="Left drink order bubble">
  <img id="orderLeftDrink" class="layer hidden" src="assets/order_bubble_left_drink_dark.png" alt="Left drink order">

  <img id="customer" class="layer" src="assets/customer_vin_middle.png" alt="Middle customer">
  <img id="orderBubbleMiddlePizza" class="layer hidden" src="assets/order_bubble_middle_queue.png" alt="Middle pizza order bubble">
  <img id="orderMiddlePizza" class="layer hidden" src="assets/order_cheese_middle_queue.png" alt="Middle pizza order">
  <img id="orderBubbleMiddleDrink" class="layer hidden" src="assets/order_bubble_middle_drink_queue.png" alt="Middle drink order bubble">
  <img id="orderMiddleDrink" class="layer hidden" src="assets/order_bubble_middle_drink_dark.png" alt="Middle drink order">

  <img id="customerRight" class="layer" src="assets/customer_hot_mom_right.png" alt="Right customer">
  <img id="orderBubbleRightPizza" class="layer hidden" src="assets/order_bubble_right_queue.png" alt="Right pizza order bubble">
  <img id="orderRightPizza" class="layer hidden" src="assets/order_cheese_right_queue.png" alt="Right pizza order">
  <img id="orderBubbleRightDrink" class="layer hidden" src="assets/order_bubble_right_drink_queue.png" alt="Right drink order bubble">
  <img id="orderRightDrink" class="layer hidden" src="assets/order_bubble_right_drink_dark.png" alt="Right drink order">

  <img id="cupLeftEmpty" class="layer hidden" src="assets/cup_dark_empty.png" alt="Empty cup under dark soda">
  <img id="cupLeftFull" class="layer hidden" src="assets/cup_dark_full.png" alt="Filled dark soda">
  <img id="cupRightEmpty" class="layer hidden" src="assets/cup_light_empty.png" alt="Empty cup under light soda">
  <img id="cupRightFull" class="layer hidden" src="assets/cup_light_full.png" alt="Filled light soda">

  <img id="pepperoniPanEmpty" class="layer" src="assets/pan_pepperoni_empty.png" alt="Empty pepperoni pan">
  <div id="pepperoniPanLabel" class="hidden">CUT PEPPERONI</div>
  <img id="doughCounter" class="layer hidden" src="assets/dough_on_counter.png" alt="Dough on counter">
  <img id="crust" class="layer hidden" src="assets/pizza_crust_counter.png" alt="Pizza crust">
  <img id="spoon" class="layer hidden" src="assets/sauce_on_spoon_counter.png" alt="Sauce spoon">
  <img id="sauced" class="layer hidden" src="assets/sauce_on_crust_counter.png" alt="Sauced crust">
  <img id="cheeseCounter" class="layer hidden" src="assets/cheese_on_counter.png" alt="Cheese on counter">
  <img id="cheeseLayer" class="layer hidden" src="assets/cheese_on_crust_counter.png" alt="Cheese on pizza">
  <img id="sausageFull" class="layer hidden" src="assets/sausage_full_counter.png" alt="Whole sausage on counter">
  <img id="sausageHalf" class="layer hidden" src="assets/sausage_half_cut_counter.png" alt="Half-cut sausage on counter">
  <img id="pepperoniCut" class="layer hidden" src="assets/pepperoni_cut_counter.png" alt="Cut pepperoni on counter">
  <img id="rawPizza" class="layer hidden" src="assets/pizza_pepperoni_raw_counter.png" alt="Raw pepperoni pizza">
  <img id="ovenOpen" class="layer hidden" src="assets/oven_top_door_open(1).png" alt="Open oven">
  <img id="pizzaOvenOpen" class="layer hidden" src="assets/pizza_pepperoni_top_open.png" alt="Pepperoni pizza in open oven">
  <img id="pizzaOvenClosed" class="layer hidden" src="assets/pizza_pepperoni_top_closed.png" alt="Pizza baking in top oven">

  let phoneOrders=[],phoneOrderSeq=0,selectedPhoneOrderId=null,phoneRinging=false,phoneRingMissId=null,phoneNextCallId=null,phoneClockId=null,phoneRingRepeatId=null,phoneRingPulseHideId=null;
  const MAX_HAZARDS=2;
  let mapVehicle=null,mapDestination=null,mapPreviewKey=null,activeHazards=[],hazardSeq=0,hazardIntervalId=null;
  const activeDeliveries={car:null,bike:null};

  function formatPhoneTime(seconds){if(seconds<0)return 'LATE';const m=Math.floor(seconds/60),s=Math.max(0,seconds%60);return `${m}:${String(s).padStart(2,'0')}`}
  function phoneAddress(key){return PHONE_ADDRESSES.find(a=>a.key===key)||PHONE_ADDRESSES[0]}
  function getPhoneOrder(id){return phoneOrders.find(o=>o.id===id)||null}
  function selectedPhoneOrder(){return getPhoneOrder(selectedPhoneOrderId)}
  function pendingPhoneOrders(){return phoneOrders.filter(o=>o.status==='pending'||o.status==='delivering')}
  function selectPhoneOrder(id){selectedPhoneOrderId=id;mapPreviewKey=null;renderPhoneOrders();renderMapState()}
  function randomPhoneAddress(){
    const current=new Set(phoneOrders.map(o=>o.address));let choices=PHONE_ADDRESSES.filter(a=>!current.has(a.key));if(!choices.length)choices=PHONE_ADDRESSES;
    return choices[Math.floor(Math.random()*choices.length)];
  }
  function renderPhoneOrders(){
    phoneOrdersPanel.innerHTML='';
    const visible=phoneOrders.slice(0,PHONE_MAX_ORDERS);
    visible.forEach(order=>{
      const row=document.createElement('button');row.type='button';row.className='phone-order-row';
      if(order.id===selectedPhoneOrderId)row.classList.add('selected');if(order.status==='delivering')row.classList.add('delivering');if(order.late)row.classList.add('late');
      const statusPrefix=order.status==='delivering'?'ON WAY • ':'';
      row.innerHTML=`<span class="phone-order-type">${statusPrefix}${ITEM_LABELS[order.type]}</span><span class="phone-order-address">${phoneAddress(order.address).label}</span><span class="phone-order-time">${order.late?'LATE':formatPhoneTime(order.deadline)}</span>`;
      bindTap(row,()=>selectPhoneOrder(order.id));phoneOrdersPanel.appendChild(row);
    });
    if(visible.length<PHONE_MAX_ORDERS){const empty=document.createElement('div');empty.className='phone-order-row';empty.innerHTML='<span class="phone-order-empty">WAITING FOR CALL...</span>';phoneOrdersPanel.appendChild(empty)}
    const count=pendingPhoneOrders().length;mapButtonStatus.textContent=count?`${count} ACTIVE ORDER${count===1?'':'S'}`:'NO PHONE ORDERS';
  }
  function addPhoneOrder(){
    if(phoneOrders.length>=PHONE_MAX_ORDERS){flashMsg('PHONE ORDER QUEUE FULL');return}
    const address=randomPhoneAddress();const type=Math.random()<.5?'cheese':'pepperoni';
    const order={id:++phoneOrderSeq,type,address:address.key,deadline:[300,330,360][Math.floor(Math.random()*3)],status:'pending',late:false,vehicle:null,route:null,eta:null,deliveryRemaining:null,totalDuration:null,seenHazards:new Set()};
    phoneOrders.push(order);if(!selectedPhoneOrderId)selectedPhoneOrderId=order.id;renderPhoneOrders();flashMsg(`${ITEM_LABELS[type]} • ${address.label}`,1700);
  }
  function triggerPhoneRingPulse(){
    if(!phoneRinging)return;clearTimeout(phoneRingPulseHideId);phoneRingLayer.classList.remove('hidden');phoneRingLayer.classList.add('ringing');flashMsg('PHONE RINGING',1000);
    phoneRingPulseHideId=setTimeout(()=>{if(phoneRinging){phoneRingLayer.classList.add('hidden');phoneRingLayer.classList.remove('ringing')}},4200);
  }
  function stopPhoneRing(){phoneRinging=false;clearTimeout(phoneRingMissId);clearTimeout(phoneRingPulseHideId);clearInterval(phoneRingRepeatId);phoneRingMissId=phoneRingPulseHideId=phoneRingRepeatId=null;phoneRingLayer.classList.add('hidden');phoneRingLayer.classList.remove('ringing')}
  function schedulePhoneCall(delay=120000){clearTimeout(phoneNextCallId);phoneNextCallId=null;if(!shopOpen)return;phoneNextCallId=setTimeout(startPhoneRing,delay)}
  function startPhoneRing(){
    if(!shopOpen)return;
    if(phoneRinging)return;
    if(phoneOrders.length>=PHONE_MAX_ORDERS){schedulePhoneCall(120000);return}
    phoneRinging=true;triggerPhoneRingPulse();phoneRingRepeatId=setInterval(triggerPhoneRingPulse,15000);
  }
  function answerPhone(){
    if(!phoneRinging){flashMsg('NO CALL RIGHT NOW');return}
    stopPhoneRing();addPhoneOrder();schedulePhoneCall(120000);
  }

  function hazardRule(type){return HAZARD_TYPES.find(h=>h.type===type)||HAZARD_TYPES[0]}
  function hazardPenalty(hazard,vehicle){const rule=hazardRule(hazard.type);return rule[vehicle]||0}
  function hazardsOnRoute(segments){return activeHazards.filter(h=>segments.includes(h.segment))}
  function bestRoute(destination,vehicle){
    const base=BASE_ETAS[destination][vehicle];let best=null;
    ROUTES[destination][vehicle].forEach(option=>{
      const hazardSeconds=hazardsOnRoute(option.segments).reduce((sum,h)=>sum+hazardPenalty(h,vehicle),0);const eta=base+option.extra+hazardSeconds;
      if(!best||eta<best.eta)best={eta,segments:option.segments.slice(),hazardSeconds,extra:option.extra};
    });return best;
  }
  function renderHazards(){
    mapHazardsEl.innerHTML='';activeHazards.forEach(h=>{const [x,y]=SEGMENT_COORDS[h.segment];const img=document.createElement('img');img.className='hazard-marker';img.src=`assets/${h.type}.png`;img.alt=h.type.replaceAll('_',' ');img.title=`${h.segment}: ${img.alt}`;img.style.left=(x-29)+'px';img.style.top=(y-28)+'px';mapHazardsEl.appendChild(img)});
    mapHazardCount.textContent='';
  }
  function addHazard(segment,type){
    if(activeHazards.length>=MAX_HAZARDS||activeHazards.some(h=>h.segment===segment))return false;
    const hazard={id:++hazardSeq,segment,type};activeHazards.push(hazard);
    Object.values(activeDeliveries).forEach(orderId=>{const order=getPhoneOrder(orderId);if(!order||!order.route||!order.route.includes(segment)||order.seenHazards.has(hazard.id))return;const added=hazardPenalty(hazard,order.vehicle);order.seenHazards.add(hazard.id);order.deliveryRemaining+=added;order.totalDuration+=added;flashMsg(`${type.replaceAll('_',' ').toUpperCase()} +${added}s`,1500)});
    renderHazards();renderMapState();return true;
  }
  function removeRandomHazard(){if(!activeHazards.length)return;activeHazards.splice(Math.floor(Math.random()*activeHazards.length),1);renderHazards();renderMapState()}
  function weightedSegment(){
    const open=Object.keys(SEGMENT_COORDS).filter(s=>!activeHazards.some(h=>h.segment===s));if(!open.length)return null;const bag=[];open.forEach(s=>{const weight=(s==='I2'||s==='Path 4')?6:1;for(let i=0;i<weight;i++)bag.push(s)});return bag[Math.floor(Math.random()*bag.length)]
  }
  function randomHazardType(segment){if((segment==='I2'||segment==='Path 4')&&Math.random()<.72)return 'road_close';return HAZARD_TYPES[Math.floor(Math.random()*HAZARD_TYPES.length)].type}
  function mutateHazards(){
    if(activeHazards.length&&Math.random()<.34)removeRandomHazard();
    if(activeHazards.length<MAX_HAZARDS&&Math.random()<.8){const segment=weightedSegment();if(segment)addHazard(segment,randomHazardType(segment))}
    if(activeHazards.length<MAX_HAZARDS&&!activeHazards.some(h=>(h.segment==='I2'||h.segment==='Path 4')&&h.type==='road_close')&&Math.random()<.75){const segment=!activeHazards.some(h=>h.segment==='I2')?'I2':'Path 4';addHazard(segment,'road_close')}
  }
  function resetHazards(){activeHazards=[];hazardSeq=0;addHazard(Math.random()<.5?'I2':'Path 4','road_close');const second=weightedSegment();if(second)addHazard(second,randomHazardType(second));renderHazards()}

  function hideMapEtas(){Object.values(mapEtaEls).forEach(el=>{el.classList.add('hidden');el.textContent=''})}
  function hideMapHighlights(){Object.values(mapHighlights).forEach(el=>el.classList.add('hidden'))}
  function routeText(route){return route.segments.join(' → ')}
  function chooseMapVehicle(vehicle){
    mapVehicle=vehicle;mapDestination=null;mapPreviewKey=null;hideMapEtas();hideMapHighlights();mapCarSprite.classList.toggle('selected',vehicle==='car');mapBikeSprite.classList.toggle('selected',vehicle==='bike');
    const busy=activeDeliveries[vehicle];mapRouteStatus.classList.remove('hidden');mapRouteStatus.textContent=busy?`${vehicle.toUpperCase()} IS CURRENTLY DELIVERING.`:`${vehicle.toUpperCase()} SELECTED. CLICK A LOCATION FOR ETA.`;
  }
  function chooseMapDestination(destination){
    if(!mapVehicle){mapRouteStatus.classList.add('hidden');flashMsg('CHOOSE CAR OR BIKE');return}
    const route=bestRoute(destination,mapVehicle);mapDestination=destination;hideMapHighlights();hideMapEtas();mapHighlights[destination].classList.remove('hidden');mapEtaEls[destination].textContent=`ETA ${route.eta}s`;mapEtaEls[destination].classList.remove('hidden');
    const order=selectedPhoneOrder();
    if(!order){mapRouteStatus.classList.remove('hidden');mapRouteStatus.textContent=`${phoneAddress(destination).label}: ${route.eta}s • ${routeText(route)}`;return}
    if(order.status==='delivering'){mapRouteStatus.classList.remove('hidden');mapRouteStatus.textContent=`ORDER ALREADY ON THE WAY • ${Math.max(0,order.deliveryRemaining)}s LEFT.`;return}
    if(order.address!==destination){mapPreviewKey=null;mapRouteStatus.classList.remove('hidden');mapRouteStatus.textContent=`THIS ORDER GOES TO ${phoneAddress(order.address).label}. ${phoneAddress(destination).label} ETA: ${route.eta}s.`;return}
    if(activeDeliveries[mapVehicle]){mapPreviewKey=null;mapRouteStatus.classList.remove('hidden');mapRouteStatus.textContent=`${mapVehicle.toUpperCase()} IS BUSY. SELECT THE OTHER VEHICLE.`;return}
    const stockIndex=stock.findIndex(item=>item&&item.type===order.type);
    if(stockIndex<0){mapPreviewKey=null;mapRouteStatus.classList.remove('hidden');mapRouteStatus.textContent=`NEED ${ITEM_LABELS[order.type]} IN PIZZA STOCK BEFORE DISPATCH.`;return}
    const key=`${order.id}|${mapVehicle}|${destination}|${route.segments.join(',')}|${route.eta}`;
    if(mapPreviewKey===key){dispatchPhoneOrder(order,mapVehicle,route,stockIndex);return}
    mapPreviewKey=key;mapRouteStatus.classList.remove('hidden');mapRouteStatus.textContent=`ETA ${route.eta}s • ${routeText(route)} • CLICK ${phoneAddress(destination).label} AGAIN TO DISPATCH.`;
  }
  function dispatchPhoneOrder(order,vehicle,route,stockIndex){
    stock[stockIndex]=null;if(selectedStock===stockIndex)selectedStock=-1;refreshStockUI();
    order.status='delivering';order.vehicle=vehicle;order.route=route.segments.slice();order.eta=route.eta;order.deliveryRemaining=route.eta;order.totalDuration=route.eta;order.seenHazards=new Set(hazardsOnRoute(order.route).map(h=>h.id));activeDeliveries[vehicle]=order.id;mapPreviewKey=null;
    mapRouteStatus.classList.remove('hidden');mapRouteStatus.textContent=`${vehicle.toUpperCase()} DISPATCHED TO ${phoneAddress(order.address).label} • ${route.eta}s.`;renderPhoneOrders();renderMapState();flashMsg('DELIVERY DISPATCHED',1200);
  }
  function completePhoneDelivery(order){
    if(!order||order.status!=='delivering')return;activeDeliveries[order.vehicle]=null;order.status='complete';money+=PRICES[order.type];moneyCollectText.textContent='$'+money.toFixed(2);incrementDailyGoal('deliveries');flashMsg(`${phoneAddress(order.address).label} DELIVERED +$${PRICES[order.type].toFixed(2)}`,1700);
    setTimeout(()=>{phoneOrders=phoneOrders.filter(o=>o.id!==order.id);if(selectedPhoneOrderId===order.id)selectedPhoneOrderId=phoneOrders[0]?.id||null;renderPhoneOrders();renderMapState()},1300);
  }
  function expirePhoneOrder(order){
    if(order.status==='delivering'){order.late=true;return}
    flashMsg(`${phoneAddress(order.address).label} ORDER EXPIRED`,1300);phoneOrders=phoneOrders.filter(o=>o.id!==order.id);if(selectedPhoneOrderId===order.id)selectedPhoneOrderId=phoneOrders[0]?.id||null;
  }

  function polylinePoint(points,t){
    if(points.length<2)return points[0]||JODY_POINT;const lengths=[];let total=0;for(let i=1;i<points.length;i++){const dx=points[i][0]-points[i-1][0],dy=points[i][1]-points[i-1][1],len=Math.hypot(dx,dy);lengths.push(len);total+=len}let target=Math.max(0,Math.min(1,t))*total;
    for(let i=0;i<lengths.length;i++){if(target<=lengths[i]){const r=lengths[i]?target/lengths[i]:0;return [points[i][0]+(points[i+1][0]-points[i][0])*r,points[i][1]+(points[i+1][1]-points[i][1])*r]}target-=lengths[i]}return points[points.length-1]
  }
  function updateVehicleSprite(vehicle){
    const sprite=vehicle==='car'?mapCarSprite:mapBikeSprite,order=getPhoneOrder(activeDeliveries[vehicle]);const anchor=VEHICLE_ANCHOR[vehicle];
    if(!order){sprite.classList.remove('hidden');sprite.style.transform='translate(0px,0px)';sprite.src=`assets/${vehicle==='car'?'car_drive_right':'bike_ride_right'}.png`;return}
    const points=[JODY_POINT,...order.route.map(s=>SEGMENT_COORDS[s]).filter(Boolean),DEST_POINTS[order.address]];const progress=1-Math.max(0,order.deliveryRemaining)/Math.max(1,order.totalDuration);const point=polylinePoint(points,progress);const lookAhead=polylinePoint(points,Math.min(1,progress+.015));const direction=lookAhead[0]<point[0]?'left':'right';sprite.src=`assets/${vehicle}_${vehicle==='car'?'drive':'ride'}_${direction}.png`;sprite.style.transform=`translate(${point[0]-anchor[0]}px,${point[1]-anchor[1]}px)`;sprite.classList.remove('hidden')
  }
  function renderMapState(){
    const order=selectedPhoneOrder();mapOrderSummary.textContent=order?`${ITEM_LABELS[order.type]} → ${phoneAddress(order.address).label} • ${order.late?'LATE':formatPhoneTime(order.deadline)}`:'SELECT A PHONE ORDER FROM THE BOTTOM TAB';
    updateVehicleSprite('car');updateVehicleSprite('bike');renderHazards();
    if(mapDestination&&mapVehicle){const route=bestRoute(mapDestination,mapVehicle);mapEtaEls[mapDestination].textContent=`ETA ${route.eta}s`}
  }
  function openDeliveryMap(){
    const active=pendingPhoneOrders();if(!active.length){flashMsg('NO PHONE ORDERS');return}if(!selectedPhoneOrder()||selectedPhoneOrder().status==='complete')selectedPhoneOrderId=active[0].id;
    mapOverlay.classList.remove('hidden');mapVehicle=null;mapDestination=null;mapPreviewKey=null;hideMapHighlights();hideMapEtas();mapCarSprite.classList.remove('selected');mapBikeSprite.classList.remove('selected');mapRouteStatus.textContent='';mapRouteStatus.classList.add('hidden');renderPhoneOrders();renderMapState();
  }
  function closeDeliveryMap(){mapOverlay.classList.add('hidden');mapPreviewKey=null}
  function phoneTick(){
    const expired=[];phoneOrders.forEach(order=>{if(order.status==='complete')return;order.deadline-=1;if(order.deadline<0&&order.status==='pending')expired.push(order);if(order.deadline<0&&order.status==='delivering')order.late=true;if(order.status==='delivering'){order.deliveryRemaining-=1;if(order.deliveryRemaining<=0)completePhoneDelivery(order)}});expired.forEach(expirePhoneOrder);renderPhoneOrders();if(!mapOverlay.classList.contains('hidden'))renderMapState();
  }
  function resetPhoneSystem(){
    clearTimeout(phoneRingMissId);clearTimeout(phoneNextCallId);clearInterval(phoneClockId);clearInterval(hazardIntervalId);clearInterval(phoneRingRepeatId);clearTimeout(phoneRingPulseHideId);stopPhoneRing();phoneOrders=[];phoneOrderSeq=0;selectedPhoneOrderId=null;mapVehicle=null;mapDestination=null;mapPreviewKey=null;activeDeliveries.car=activeDeliveries.bike=null;mapOverlay.classList.add('hidden');hideMapHighlights();hideMapEtas();renderPhoneOrders();resetHazards();phoneClockId=setInterval(phoneTick,1000);hazardIntervalId=setInterval(mutateHazards,7000);if(shopOpen)schedulePhoneCall(120000);
  }

  applyPixelBox(phoneHotspot,PHONE_HITBOX);bindTap(phoneHotspot,answerPhone);phoneHotspot.classList.remove('hidden');
  bindTap(openMapButton,openDeliveryMap);bindTap($('mapCarButton'),()=>chooseMapVehicle('car'));bindTap($('mapBikeButton'),()=>chooseMapVehicle('bike'));bindTap($('mapBackButton'),closeDeliveryMap);
  setPixelArea($('mapCarButton'),MAP_HITBOXES.car,()=>chooseMapVehicle('car'));setPixelArea($('mapBikeButton'),MAP_HITBOXES.bike,()=>chooseMapVehicle('bike'));setPixelArea($('mapBackButton'),MAP_HITBOXES.back,closeDeliveryMap);
  Object.entries(mapLocationButtons).forEach(([key,button])=>setPixelArea(button,MAP_HITBOXES[key],()=>chooseMapDestination(key)));


  bindTap($('reset'),()=>{
    clearPrepTimer();clearCustomerTimers();clearPepperoniPreview();clearDrinkArea();Object.values(ovens).forEach(o=>{clearOvenTimers(o);hide(o.openId);hide(o.openPizzaId);hide(o.closedPizzaId);$(o.closedPizzaId).classList.remove('oven-burnt');o.trashLabel.classList.add('hidden');o.state='empty';o.type=null});
    money=0;moneyCollectText.textContent='$0.00';orderPatternBag=[];arrivalDelayBag=[];lastArrivalDelay=null;Object.values(customerLanes).forEach(l=>{l.el.className='layer';l.present=false;l.ordered=false;l.orderItems=[];l.customerId=null;l.lastCustomerId=null;l.initialOrderUsed=false;l.lastArrivalDelay=null;hideOrderVisuals(l);setLaneHotspot(l,false)});prepState='idle';prepPizzaType=null;loadingOven=null;pepperoniUses=3;pepperoniPrepStage='idle';ingredientLocked=false;boxingOven=null;stock.fill(null);selectedStock=-1;clearPrepSurface();clearBoxingVisuals();clearOrderPanel();clearMainHotspots();clearAllOvenHotspots();clearBoxHotspot();setDoughHotspot(true);updatePepperoniDisplay();refreshStockUI();showPrepStationIfNeeded();setDrinkHotspots();nextGlobalArrivalAt=0;resetDailyGoals();resetPhoneSystem();resetShopClock()
  });

  setDoughHotspot(true);updatePepperoniDisplay();refreshStockUI();showPrepStationIfNeeded();setDrinkHotspots();nextGlobalArrivalAt=0;resetDailyGoals();resetPhoneSystem();resetShopClock();
})();
</script>
